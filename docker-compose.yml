services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    volumes:
      - ./apps/server:/app/apps/server
    ports:
      - "127.0.0.1:3000:3000"

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3000/soc/api
    volumes:
      - ./apps/client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - server

volumes:
  client_node_modules:
